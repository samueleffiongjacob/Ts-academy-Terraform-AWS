name: Deploy Infrastructure with terraform

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: eu-north-1
  TF_VERSION: "1.11.4"

# every `run:` step starts inside the terraform/ folder
defaults:
  run:
    working-directory: terraform

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # terraform/ansible.tf runs ansible-playbook during apply
      - name: Install Ansible
        run: pipx install ansible-core

      # Same key as on your laptop. Add it once in GitHub:
      # Settings > Secrets and variables > Actions > New repository secret
      #   name:  EC2_SSH_PRIVATE_KEY   value: full contents of devop-aws-ssh.pem
      - name: Write SSH key
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/devop-aws-ssh.pem
          chmod 400 ~/.ssh/devop-aws-ssh.pem

      # Needs terraform/backend.tf (rename backend.tf.example) and a repo VARIABLE
      # TF_STATE_BUCKET. Without remote state every run starts from scratch.
      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=ts-academy/dev.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="use_lockfile=true"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan
